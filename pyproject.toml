[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fin-pit"
version = "0.1.0"
description = "Point-in-time guards for backtests and trading agents: available_at on every value, asof() firewalls, LangChain tool guards, strict-warmup indicators and named-variant indicator conformance vectors."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matt Busel" }]
requires-python = ">=3.9"
dependencies = [
    "fin-primitives>=3.7",
    "tzdata; platform_system == 'Windows'",
]
keywords = [
    "point-in-time", "look-ahead bias", "backtesting", "trading", "finance", "agents",
    "langchain", "langgraph", "fred", "alfred", "edgar", "technical-analysis", "indicators", "conformance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3", "numpy>=1.21"]
polars = ["polars>=1.0"]
langchain = ["langchain-core>=0.2"]
fred = ["fredapi>=0.5", "pandas>=1.3"]
yfinance = ["yfinance>=0.2", "pandas>=1.3"]
calendars = ["exchange_calendars>=4"]
all = ["pandas>=1.3", "numpy>=1.21", "polars>=1.0", "langchain-core>=0.2", "fredapi>=0.5", "yfinance>=0.2", "exchange_calendars>=4"]
test = ["pytest>=7", "hypothesis>=6", "pandas>=1.3", "numpy>=1.21", "polars>=1.0", "langchain-core>=0.2"]

[project.urls]
Homepage = "https://github.com/Mattbusel/fin-pit"
Repository = "https://github.com/Mattbusel/fin-pit"
Documentation = "https://github.com/Mattbusel/fin-pit/tree/main/docs"
Changelog = "https://github.com/Mattbusel/fin-pit/blob/main/CHANGELOG.md"
Issues = "https://github.com/Mattbusel/fin-pit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_pit"]

[tool.hatch.build.targets.sdist]
include = ["src/fin_pit", "tests", "tools", "docs", "examples", "SPEC.md", "CHANGELOG.md", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
